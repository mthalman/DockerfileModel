name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
    types: [ opened, reopened, synchronize, ready_for_review ]

defaults:
  run:
    working-directory: src

jobs:
  build-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test --no-restore -v normal -c Release --results-directory test-results -l trx

      - name: Verify packaged documentation and examples
        working-directory: .
        shell: pwsh
        run: .\tools\Documentation\Verify-Documentation.ps1

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: src/test-results/*

  # Keep the required check name stable while requiring both platforms to pass.
  build:
    needs: build-platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check platform results
        working-directory: .
        env:
          BUILD_RESULT: ${{ needs.build-platform.result }}
        run: test "$BUILD_RESULT" = success

  lean:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build and check proofs
        working-directory: lean
        run: lake build

      - name: Run property tests
        working-directory: lean
        run: lake exe DockerfileModelTests

  diff-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build Lean CLI
        working-directory: lean
        run: lake build DockerfileModelDiffTest

      - name: Build .NET DiffTest
        working-directory: src
        run: dotnet build Valleysoft.DockerfileModel.DiffTest -c Release

      - name: Run pinned upstream corpus without network
        working-directory: src
        run: |
          sudo unshare --net -- "$(command -v dotnet)" \
            Valleysoft.DockerfileModel.DiffTest/bin/Release/net8.0/Valleysoft.DockerfileModel.DiffTest.dll \
            --upstream-only --lean-cli "$GITHUB_WORKSPACE/lean/.lake/build/bin/DockerfileModelDiffTest" --workers 4

      - name: Run differential tests
        working-directory: src
        run: dotnet Valleysoft.DockerfileModel.DiffTest/bin/Release/net8.0/Valleysoft.DockerfileModel.DiffTest.dll --compare --lean-cli ../lean/.lake/build/bin/DockerfileModelDiffTest --count 10000 --seed 42 --workers 4

  upstream-importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/BuildKitCorpus/go.mod
          cache-dependency-path: tools/BuildKitCorpus/go.sum

      - name: Test importer
        working-directory: tools/BuildKitCorpus
        run: go test ./...

      - name: Verify deterministic upstream import
        working-directory: tools/BuildKitCorpus
        run: go run . --repo-root ../.. --check
