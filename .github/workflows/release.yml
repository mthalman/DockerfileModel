name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      context: ${{ steps.prepare.outputs.context }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
      already-published: ${{ steps.prepare.outputs.already-published }}

    steps:
      - name: Prepare release
        id: prepare
        uses: mthalman/release-automation/actions/prepare-release@dbda9774dde7b70af4eb22be7257ee9cd17c2d6f # v1.0.2

  validate:
    needs: prepare
    if: needs.prepare.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test --no-restore --no-build -v normal -c Release --results-directory test-results -l trx

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: src/test-results/*

      - name: Pack
        run: dotnet pack -c Release --no-build --output artifacts Valleysoft.DockerfileModel

      - name: Validate package version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          expected_package="artifacts/Valleysoft.DockerfileModel.${PACKAGE_VERSION}.nupkg"
          shopt -s nullglob
          packages=(artifacts/*.nupkg)

          if [[ ${#packages[@]} -ne 1 || "${packages[0]}" != "$expected_package" ]]; then
            echo "::error::Prepared version '$PACKAGE_VERSION' does not match the MinVer package: ${packages[*]:-none}."
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages-${{ needs.prepare.outputs.version }}
          path: src/artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [ prepare, validate ]
    if: needs.prepare.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    environment: nuget.org
    defaults:
      run:
        working-directory: src
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ needs.prepare.outputs.version }}
          path: src/artifacts

      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: thalman

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          dotnet nuget push
          "artifacts/Valleysoft.DockerfileModel.${PACKAGE_VERSION}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Attach packages to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          gh release upload "$RELEASE_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Finalize GitHub Release
        uses: mthalman/release-automation/actions/finalize-release@dbda9774dde7b70af4eb22be7257ee9cd17c2d6f # v1.0.2
        with:
          context: ${{ needs.prepare.outputs.context }}
